<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>self_osc_synth — リード＋導波路シンセ（開発中）</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #14171c;
    color: #e6e6e6;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 16px; }
  #warning {
    background: #5a1f1f;
    color: #ffd0d0;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  button {
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2f3a;
    color: #e6e6e6;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    margin-top: 16px;
    font-family: monospace;
    font-size: 0.85rem;
    color: #9ad;
    white-space: pre-wrap;
  }
  #controls {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  fieldset.param-group {
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 14px;
    min-width: 260px;
  }
  fieldset.param-group legend { color: #9ad; padding: 0 6px; }
  .param-row {
    display: grid;
    grid-template-columns: 1fr 2fr auto;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
    font-size: 0.85rem;
  }
  .param-row label { color: #ccc; }
  .param-value { font-family: monospace; color: #9ad; text-align: right; min-width: 5em; }
  input[type="range"] { width: 100%; }
  #noteStatus, #pitchIndicator {
    margin-top: 8px;
    font-family: monospace;
    font-size: 0.85rem;
    color: #cc9;
  }
  #main-layout {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
  }
  #controls { margin-top: 0; }
  #scopes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 8px;
  }
  .scope-panel { display: flex; flex-direction: column; gap: 2px; }
  .scope-panel span { font-size: 0.75rem; color: #789; }
  canvas.scope { background: #0c0e12; border: 1px solid #333; border-radius: 4px; }
</style>
</head>
<body>
  <h1>self_osc_synth（手順5: scope.js — 4パネル可視化）</h1>
  <div id="warning" hidden></div>
  <button id="startBtn">開始（クリックで AudioContext 起動）</button>
  <button id="noteBtn" disabled>テスト音（ノートオン/オフ）</button>
  <pre id="status">（未起動）</pre>
  <div id="noteStatus">（未演奏。QWERTY: z s x d c v g b h n j m ... で演奏可）</div>
  <div id="pitchIndicator"></div>

  <div id="main-layout">
    <div id="controls"></div>
    <div id="scopes">
      <div class="scope-panel">
        <span>1. リード相図 (x, x')</span>
        <canvas id="panel1" class="scope" width="380" height="260"></canvas>
      </div>
      <div class="scope-panel">
        <span>2. 非線形特性 + 動作点</span>
        <canvas id="panel2" class="scope" width="380" height="260"></canvas>
      </div>
      <div class="scope-panel">
        <span>3. 管内の定在波</span>
        <canvas id="panel3" class="scope" width="380" height="260"></canvas>
      </div>
      <div class="scope-panel">
        <span>4. 波形 / スペクトル</span>
        <canvas id="panel4" class="scope" width="380" height="260"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
